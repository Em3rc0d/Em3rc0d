<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Em3rc0d — Eduardo Merino engineering profile hero</title>
<desc id="desc">Animated engineering systems hero showing frontend, backend, data and AI nodes around a terminal interface.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
    <stop stop-color="#020617"/>
    <stop offset="0.46" stop-color="#0B1025"/>
    <stop offset="1" stop-color="#071426"/>
  </linearGradient>
  <linearGradient id="accent" x1="210" y1="80" x2="980" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A78BFA"/>
    <stop offset="0.45" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="terminalBorder" x1="160" y1="112" x2="890" y2="420" gradientUnits="userSpaceOnUse">
    <stop stop-color="#4F46E5" stop-opacity=".9"/>
    <stop offset=".55" stop-color="#0EA5E9" stop-opacity=".85"/>
    <stop offset="1" stop-color="#22D3EE" stop-opacity=".7"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(182 66) rotate(37) scale(390 250)" gradientUnits="userSpaceOnUse"><stop stop-color="#4F46E5" stop-opacity=".22"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1050 420) rotate(-145) scale(390 240)" gradientUnits="userSpaceOnUse"><stop stop-color="#06B6D4" stop-opacity=".19"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity=".055" stroke-width="1"/></pattern>
  <clipPath id="terminalClip"><rect x="143" y="255" width="727" height="177" rx="19"/></clipPath>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    .pulse2 { animation: pulse 3.4s ease-in-out .7s infinite; transform-origin: center; }
    .blink { animation: blink 1s steps(1,end) infinite; }
    .float1 { animation: float1 5.5s ease-in-out infinite; }
    .float2 { animation: float2 6.3s ease-in-out .8s infinite; }
    .flow { stroke-dasharray: 8 12; animation: dash 2.2s linear infinite; }
    .flowSlow { stroke-dasharray: 5 13; animation: dash 3.2s linear infinite reverse; }
    .scan { animation: scan 4.8s linear infinite; }
    .appear1 { animation: appear 7s ease-in-out infinite; }
    .appear2 { animation: appear 7s ease-in-out 1.4s infinite; }
    .appear3 { animation: appear 7s ease-in-out 2.8s infinite; }
    .status { animation: status 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.94); } 50% { opacity:1; transform:scale(1.08); } }
    @keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:0; } }
    @keyframes float1 { 0%,100% { transform:translateY(0px); } 50% { transform:translateY(-7px); } }
    @keyframes float2 { 0%,100% { transform:translateY(0px); } 50% { transform:translateY(8px); } }
    @keyframes dash { to { stroke-dashoffset:-40; } }
    @keyframes scan { 0% { transform:translateX(-180px); opacity:0; } 15% { opacity:.75; } 55% { opacity:.25; } 100% { transform:translateX(980px); opacity:0; } }
    @keyframes appear { 0%,14% { opacity:.2; } 24%,70% { opacity:1; } 84%,100% { opacity:.2; } }
    @keyframes status { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</defs>
