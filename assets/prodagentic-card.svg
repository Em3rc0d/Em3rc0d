<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">prodAgentic project card</title><desc id="d">Agentic product engineering and reproducible AI workflows.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320"><stop stop-color="#020617"/><stop offset=".55" stop-color="#0B1024"/><stop offset="1" stop-color="#18112E"/></linearGradient><linearGradient id="a" x1="40" y1="20" x2="1160" y2="300"><stop stop-color="#A78BFA"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity=".05"/></pattern><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.s{font-family:Inter,system-ui,sans-serif}.p{animation:p 3.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><rect width="1200" height="320" rx="24" fill="url(#g)"/><rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#334155"/><path d="M28 1H330" stroke="url(#a)" stroke-width="2"/><text x="48" y="42" class="m" font-size="12" letter-spacing="2" fill="#A78BFA">AGENTIC PRODUCT ENGINEERING</text><text x="48" y="86" class="s" font-size="38" font-weight="800" fill="#F8FAFC">prodAgentic</text><text x="48" y="116" class="m" font-size="12" fill="#64748B">Em3rc0d/prodAgentic</text><text x="48" y="158" class="s" font-size="22" font-weight="750" fill="#E2E8F0">From prompts to product workflows.</text><text x="48" y="184" class="s" font-size="15" fill="#94A3B8">Engineering agentic systems around tools, context, evidence, validation and repeatable product actions.</text><g class="m" font-size="12" fill="#D6E3F0"><rect x="48" y="214" width="86" height="28" rx="14" fill="#0F172A